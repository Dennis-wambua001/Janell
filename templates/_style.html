<style>body{font:16px sans-serif;max-width:900px;margin:0 auto;padding:16px;color:#2B2118;background:#FBF7EE}h1,h2{font-family:Georgia,serif;color:#0B3B2C}
a{color:#0B3B2C}
input,select,textarea,button,.btn{padding:12px;font:inherit;box-sizing:border-box;width:100%;border:1px solid #7A7160;border-radius:4px;background:#fff;color:#2B2118}
form.add{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px;background:#E3EEE7;border:1px solid #C9A24D;padding:16px;border-radius:6px}.wide{grid-column:1/-1}
label{display:block;font-weight:600}label input,label select,label textarea{font-weight:400;margin-top:4px}
.btn{width:auto;display:inline-block;background:#fff;cursor:pointer;font-weight:600;text-decoration:none}
.save,button.go{background:#0B3B2C;color:#fff;border:1px solid #C9A24D;font-weight:600;cursor:pointer}
input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible,.btn:focus-visible{outline:3px solid #C9A24D;outline-offset:2px}
#prev{max-width:240px;max-height:240px;display:block;margin-top:8px;border-radius:4px}[hidden]{display:none!important}
table{border-collapse:collapse;width:100%;display:block;overflow-x:auto}th{background:#F3EBD6;color:#0B3B2C}td,th{border-bottom:1px solid #DCD2B4;padding:8px;text-align:left}td img{width:56px;height:56px;object-fit:cover}
td button,td a{display:inline-block;width:auto;padding:8px 12px;margin:2px 0;font-size:14px}td form{margin:0}</style>
